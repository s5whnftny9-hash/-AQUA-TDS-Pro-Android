name: Build AQUA TDS Pro APK V2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and unzip Android project
        run: |
          echo "Repository files:"
          ls -lah

          ZIPFILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIPFILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIPFILE"

          mkdir -p extracted
          unzip "$ZIPFILE" -d extracted

          PROJECT_FILE=$(find extracted -type f -name "settings.gradle" | head -n 1)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project found at: $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "output/AQUA-TDS-Pro.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AQUA-TDS-Pro-APK
          path: output/AQUA-TDS-Pro.apk
