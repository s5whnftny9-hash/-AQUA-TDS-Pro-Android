name: Build AQUA TDS Pro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          unzip AQUA_TDS_Pro_Android_GitHub_iPhone.zip
          ls -la
          ls -la AQUA_TDS_Pro_Android_GitHub

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: AQUA_TDS_Pro_Android_GitHub
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p output
          cp AQUA_TDS_Pro_Android_GitHub/app/build/outputs/apk/debug/app-debug.apk "output/AQUA-TDS-Pro.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AQUA-TDS-Pro-APK
          path: output/AQUA-TDS-Pro.apk
