name: Build AQUA TDS Pro APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Find and unzip Android project
        run: |
          echo "Files in repository:"
          ls -la

          ZIPFILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          echo "ZIP found:"
          echo "$ZIPFILE"

          unzip "$ZIPFILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -50

          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle | head -n 1)")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace


      - name: Prepare APK
        run: |
          mkdir -p output

          cp \
          "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" \
          "output/AQUA-TDS-Pro.apk"


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AQUA-TDS-Pro-APK
          path: output/AQUA-TDS-Pro.apk
